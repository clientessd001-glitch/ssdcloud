name: Compilar APK Nexus Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Compilar APK de Debug
        env:
          API_ID_SECRETA: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH_SECRETA: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug

      - name: Upload do APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-apk
          path: app/build/outputs/apk/debug/app-debug.apk
