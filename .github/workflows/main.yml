name: Compilar APK Nexus Cloud v1.5

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Cache do Gradle
        uses: actions/setup-gradle@v3

      - name: Dar Permissão de Execução ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NexusCloud-v1.5-Debug
          path: app/build/outputs/apk/debug/*.apk
