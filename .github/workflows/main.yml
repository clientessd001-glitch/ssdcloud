name: Build Nexus Cloud APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 5. Garantir permissão de execução ao Gradlew
        run: chmod +x gradlew

      - name: 6. Compilar APK Debug (Nexus Cloud)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Cloud-SSD-v1.5-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
