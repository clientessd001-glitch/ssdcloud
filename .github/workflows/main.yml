name: Compilar APK Nexus Cloud v1.5

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Configurar Cache do Gradle
        uses: actions/setup-gradle@v3

      - name: 4. Dar Permissao ao Gradlew
        run: chmod +x gradlew

      - name: 5. Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NexusCloud-v1.5-APK
          path: app/build/outputs/apk/debug/*.apk
