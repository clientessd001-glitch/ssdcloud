name: Compilar APK Nexus Cloud
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compilar APK
        env:
          API_ID_SECRETA: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH_SECRETA: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-apk
          path: app/build/outputs/apk/debug/app-debug.apk
